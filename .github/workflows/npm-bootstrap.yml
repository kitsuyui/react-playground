name: Stage a new npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to stage for initial publication
        required: true
        type: choice
        options:
          - alarm
          - metronome

concurrency:
  group: npm-bootstrap-${{ inputs.package }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        run: |
          case "$GITHUB_REF" in refs/tags/v[0-9]*) ;; *) echo 'Select a version tag as the workflow ref' >&2; exit 1;; esac
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify tag is included in main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.13.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0
      - name: Build and validate
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run typecheck
          bun run build
          bun run validate
      - name: Validate package and version
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -eu
          case "$PACKAGE" in alarm|metronome) ;; *) exit 1;; esac
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(node -p "require('./packages/$PACKAGE/package.json').name")" = "@kitsuyui/react-$PACKAGE"
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@kitsuyui%2freact-$PACKAGE")
          test "$status" = 404 || { echo "Package already exists or registry request failed: $status" >&2; exit 1; }
          (cd "packages/$PACKAGE" && bun pm pkg set version="$version")
      - name: Stage package with provenance
        env:
          PACKAGE: ${{ inputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -eu
          test -n "$NODE_AUTH_TOKEN"
          cd "packages/$PACKAGE"
          npm stage publish --access public --provenance
